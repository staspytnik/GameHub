<section class="games" id="allGames">
  <div class="container">
    <div class="games__title--wrapper">
      <div>
        <h2 class="games__title">All games</h2>
        <p class="games__subtitle"><span id="num-of-games"></span> results</p>
      </div>
      <div class="games__search">
        <svg
          class="games__svg"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M7.33333 12.6667C10.2789 12.6667 12.6667 10.2789 12.6667 7.33333C12.6667 4.38781 10.2789 2 7.33333 2C4.38781 2 2 4.38781 2 7.33333C2 10.2789 4.38781 12.6667 7.33333 12.6667Z"
            stroke="#9696A3"
            stroke-width="1.33333"
          />
          <path d="M14 14L11.1 11.1" stroke="#9696A3" stroke-width="1.33333" />
        </svg>
        <input class="games__input" type="text" placeholder="Search games…" />
      </div>
    </div>
    <ul class="games__list--categories">
      <li class="games__items--categories">
        <button class="games__buttons chosen">All</button>
      </li>
    </ul>
    <div class="games__wrapper">
      <ul class="games__list"></ul>
    </div>
    <div class="games__navigation">
      <button
        type="button"
        class="games__buttons games__navigation--buttons"
        data-page="prev"
        disabled
      >
        ← Previous
      </button>
      <div class="games__pages" data-pages></div>
      <button
        type="button"
        class="games__buttons games__navigation--buttons"
        data-page="next"
      >
        Next →
      </button>
    </div>
  </div>
</section>
