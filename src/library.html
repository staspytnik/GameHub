<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>My Library</title>
    <link rel="stylesheet" href="./scss/styles.scss" />
</head>
<body>
    <div class="container">
        <header class="site-header" id="header">
            <!-- @include header -->
        </header>

        <section class="library-header">
            <div class="library-header__content">
                <h1 class="library-header__title">My Library</h1>
                <p class="library-header__subtitle">Your personal game collection</p>
            </div>

            <button class="library__button">
                <span class="library-header__add-icon">+</span>
                Add Game
            </button>
        </section>

        <section class="library-stats">
            <div class="library-stats__item">
                <span data-status="total" class="library-stats__value">0</span>
                <span class="library-stats__label">Total Games</span>
            </div>

            <div class="library-stats__item library-stats__item--playing">
                <span data-status="playing" class="library-stats__value">0</span>
                <span class="library-stats__label">Playing</span>
            </div>

            <div class="library-stats__item library-stats__item--completed">
                <span data-status="completed" class="library-stats__value">0</span>
                <span class="library-stats__label">Completed</span>
            </div>

            <div class="library-stats__item library-stats__item--want-to-play">
                <span data-status="want-to-play" class="library-stats__value">0</span>
                <span class="library-stats__label">Want to Play</span>
            </div>
        </section>

        <nav class="library-filters">
            <button class="library-filters__item library-filters__item--active">
                All
            </button>

            <button class="library-filters__item">
                Playing
            </button>

            <button class="library-filters__item">
                Completed
            </button>

            <button class="library-filters__item">
                Want to Play
            </button>
        </nav>

        <div class="library-games-list">
            <div class="library-empty">
                <div class="library-empty__icon">
                    📚
                </div>

                <h2 class="library-empty__title">
                    Your library is empty
                </h2>

                <p class="library-empty__description">
                    Start building your collection.
                </p>

                <button class="library__button">
                    + Add your first game
                </button>
            </div>
        </div>

    </div>

    <script src="./js/library.js" type="module"></script>
</body>
</html>
