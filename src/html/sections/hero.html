<div class="hero">
  <div class="hero__container">
    <ul class="hero__features">
      <li class="hero__catalog">500+ games in catalog</li>
    </ul>

    <h1 class="hero__title">
      DISCOVER <br />
      YOUR NEXT <br />
      <span class="hero__title--span">GAME</span>
    </h1>
    <p class="hero__description">
      Explore popular games, discover new worlds and build your personal game
      library.
    </p>

    <div class="hero__buttons">
      <button class="hero__button">
        Explore games
        <img src="/images/arrow.png" alt="arrow" width="12px" height="12px" />
      </button>
      <button class="hero__otherButton">
        <img
          class="hero__img"
          src="/images/dice2.png"
          alt="dice"
          width="24px"
          height="22px"
        />Surprise me
      </button>
    </div>

    <div class="hero__info">
      <div class="hero__rating">
        <img src="/images/star.svg" alt="star" /><span class="hero__infoText"
          >4.9/5</span
        >
        avg rating
      </div>
      <div class="hero__games">
        <span class="hero__infoText">500+</span> games
      </div>
      <span class="hero__genres"
        ><span class="hero__infoText">12</span> genres</span
      >
    </div>
  </div>
</div>
